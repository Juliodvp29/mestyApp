<ion-header class="ion-no-border">
  <ion-toolbar class="glass-effect">
    <ion-title>Messages</ion-title>
    <ion-buttons slot="end">
      <ion-button color="primary">
        <ion-icon slot="icon-only" name="create-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Messages</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="empty-state ion-text-center">
    <h2 class="display-hero">No Chats</h2>
    <p class="body-standard">Your conversations will appear here.</p>
    <ion-button fill="clear" color="primary" class="radius-pill">
      Start Messaging
      <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
    </ion-button>
  </div>
</ion-content>
