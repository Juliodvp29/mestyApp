<ion-content class="ion-padding" [fullscreen]="true">
  <div class="auth-container">
    <div class="auth-header">
      <h1 class="display-hero">Create Account</h1>
      <p class="body-standard">Enter your phone number to get started</p>
    </div>

    <ion-list lines="none" class="auth-form">
      <ion-item>
        <ion-input
          label="Phone Number"
          labelPlacement="stacked"
          type="tel"
          placeholder="+1 555 123 4567"
        ></ion-input>
      </ion-item>
    </ion-list>

    <ion-button expand="block" color="primary" class="auth-button">
      Send Verification Code
    </ion-button>

    <ion-text color="medium" class="auth-footer">
      <p>Already have an account? <a routerLink="/auth/login">Sign in</a></p>
    </ion-text>
  </div>
</ion-content>
