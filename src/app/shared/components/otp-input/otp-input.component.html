<div
  class="otp-row"
  [class.shake]="hasError()"
  (paste)="onPaste($event)"
>
  @for (digit of digits(); track $index; let i = $index) {
    <input
      #otpBox
      class="otp-box"
      type="text"
      inputmode="numeric"
      maxlength="1"
      autocomplete="one-time-code"
      [value]="digit"
      (input)="onInput($event, i)"
      (keydown)="onKeydown($event, i)"
    />
  }
</div>
